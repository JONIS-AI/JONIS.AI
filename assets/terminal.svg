<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="JONIS.AI terminal with identity, model engines and mission">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="0.55" stop-color="#070c18"/>
      <stop offset="1" stop-color="#0a0918"/>
    </linearGradient>
    <radialGradient id="tglowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tglowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="tframe">
      <rect width="1000" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tframe)">
    <rect width="1000" height="360" fill="url(#tbg)"/>
    <rect width="1000" height="360" fill="url(#tgrid)" opacity="0.28"/>

    <ellipse cx="140" cy="380" rx="360" ry="220" fill="url(#tglowA)"/>
    <ellipse cx="900" cy="-20" rx="340" ry="220" fill="url(#tglowB)"/>

    <rect width="1000" height="46" fill="#0b1120" opacity="0.92"/>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#1e293b" stroke-width="1"/>

    <circle cx="28" cy="23" r="5" fill="#22d3ee"/>
    <circle cx="50" cy="23" r="5" fill="#8b5cf6"/>
    <circle cx="72" cy="23" r="5" fill="#a5b4fc"/>

    <text x="500" y="27" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" letter-spacing="1" fill="#64748b">jonis@ai — zsh</text>
    <text x="972" y="27" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="12" letter-spacing="1" fill="#334155">~/vault</text>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="0.4s" dur="0.35s" fill="freeze"/>
      <text x="48" y="100" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee">$</tspan>
        <tspan fill="#e2e8f0"> whoami</tspan>
      </text>
      <text x="48" y="132" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee" fill-opacity="0.8">→ </tspan>
        <tspan fill="#f8fafc" font-weight="700">jony peixoto</tspan>
        <tspan fill="#64748b"> — founder @ cybertimeup</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="1.3s" dur="0.35s" fill="freeze"/>
      <text x="48" y="184" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee">$</tspan>
        <tspan fill="#e2e8f0"> jonis --engines</tspan>
      </text>
      <text x="48" y="216" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee" fill-opacity="0.8">→ </tspan>
        <tspan fill="#22d3ee">ollama</tspan>
        <tspan fill="#334155"> · </tspan>
        <tspan fill="#e2e8f0">claude</tspan>
        <tspan fill="#334155"> · </tspan>
        <tspan fill="#a5b4fc">gemini</tspan>
        <tspan fill="#334155"> · </tspan>
        <tspan fill="#e2e8f0">openai</tspan>
        <tspan fill="#334155"> · </tspan>
        <tspan fill="#22d3ee">obsidian</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.35s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 6" to="0 0" begin="2.2s" dur="0.35s" fill="freeze"/>
      <text x="48" y="268" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee">$</tspan>
        <tspan fill="#e2e8f0"> jonis --mission</tspan>
      </text>
      <text x="48" y="300" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5">
        <tspan fill="#22d3ee" fill-opacity="0.8">→ </tspan>
        <tspan fill="#e2e8f0">serve, connect and execute — within your rules.</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.35s" fill="freeze"/>
      <text x="48" y="336" font-family="'JetBrains Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14.5" letter-spacing="0.5" fill="#22d3ee">$</text>
      <rect x="64" y="322" width="9" height="17" fill="#22d3ee">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.75;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="1" y="1" width="998" height="358" rx="20" fill="none" stroke="#26314a" stroke-width="1"/>
  </g>
</svg>
