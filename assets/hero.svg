<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="JONIS.AI — autonomous digital butler, model-agnostic and open-source">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.5" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0b0a1a"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.42" stop-color="#c7d2fe"/>
      <stop offset="0.72" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="440" rx="28"/>
    </clipPath>
    <clipPath id="titleClip">
      <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="6">JONIS.AI</text>
    </clipPath>
    <filter id="blurGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <g opacity="0.5">
      <rect x="-40" y="-40" width="1280" height="520" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <ellipse cx="220" cy="80" rx="340" ry="240" fill="url(#glowCyan)">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="990" cy="380" rx="380" ry="250" fill="url(#glowViolet)">
      <animate attributeName="opacity" values="0.95;0.5;0.95" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <g fill="none" stroke="#22d3ee" stroke-opacity="0.16">
      <ellipse cx="600" cy="215" rx="430" ry="165" stroke-dasharray="4 16">
        <animateTransform attributeName="transform" type="rotate" from="-6 600 215" to="354 600 215" dur="60s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <g fill="none" stroke="#8b5cf6" stroke-opacity="0.14">
      <ellipse cx="600" cy="215" rx="495" ry="195" stroke-dasharray="2 22">
        <animateTransform attributeName="transform" type="rotate" from="6 600 215" to="-354 600 215" dur="80s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <circle r="3.5" fill="#22d3ee">
      <animateMotion dur="26s" repeatCount="indefinite" path="M 1030 215 a 430 165 0 1 0 -860 0 a 430 165 0 1 0 860 0"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6">
      <animateMotion dur="26s" begin="-13s" repeatCount="indefinite" path="M 1030 215 a 430 165 0 1 0 -860 0 a 430 165 0 1 0 860 0"/>
    </circle>
    <circle r="2" fill="#22d3ee" opacity="0.7">
      <animateMotion dur="40s" begin="-9s" repeatCount="indefinite" path="M 1095 215 a 495 195 0 1 0 -990 0 a 495 195 0 1 0 990 0"/>
    </circle>

    <g fill="none" stroke="url(#edge)" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <path d="M 26 64 L 26 26 L 64 26"/>
      <path d="M 1136 26 L 1174 26 L 1174 64"/>
      <path d="M 26 376 L 26 414 L 64 414"/>
      <path d="M 1174 376 L 1174 414 L 1136 414"/>
    </g>

    <rect x="0" y="-10" width="1200" height="1.5" fill="#22d3ee" opacity="0.22">
      <animate attributeName="y" values="-10;450" dur="8s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.6s" fill="freeze"/>
      <circle cx="524" cy="76" r="4" fill="#22d3ee"/>
      <circle cx="524" cy="76" r="4" fill="#22d3ee" opacity="0.6">
        <animate attributeName="r" values="4;13;4" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="542" y="80" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#64748b">SYSTEM ONLINE</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.2s" dur="1s" fill="freeze"/>
      <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="6" fill="#22d3ee" opacity="0.22" filter="url(#blurGlow)">JONIS.AI</text>
      <text x="600" y="240" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="6" fill="url(#titleFill)">JONIS.AI</text>
      <g clip-path="url(#titleClip)">
        <rect x="-300" y="140" width="220" height="120" fill="url(#sweep)" opacity="0.8">
          <animate attributeName="x" values="-300;1160;1160" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.8s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="0.8s" dur="0.8s" fill="freeze"/>
      <text x="600" y="292" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="5">
        <tspan fill="#e2e8f0">DIGITAL BUTLER</tspan>
        <tspan fill="#22d3ee">   ·   </tspan>
        <tspan fill="#e2e8f0">MODEL-AGNOSTIC</tspan>
        <tspan fill="#22d3ee">   ·   </tspan>
        <tspan fill="#e2e8f0">OPEN SOURCE</tspan>
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1s" dur="0.6s" fill="freeze"/>
      <rect x="307" y="330" width="140" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#edge)"/>
      <text x="377" y="352" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#cbd5e1">AUTONOMY</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.15s" dur="0.6s" fill="freeze"/>
      <rect x="461" y="330" width="160" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#edge)"/>
      <text x="541" y="352" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#cbd5e1">VOICE + 3D HUD</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.3s" dur="0.6s" fill="freeze"/>
      <rect x="635" y="330" width="116" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#edge)"/>
      <text x="693" y="352" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#cbd5e1">LOCAL AI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.45s" dur="0.6s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="1.45s" dur="0.6s" fill="freeze"/>
      <rect x="765" y="330" width="128" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="url(#edge)"/>
      <text x="829" y="352" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#cbd5e1">OBSIDIAN</text>
    </g>

    <text x="600" y="402" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="11" font-weight="500" letter-spacing="3.5" fill="#475569">GITHUB.COM/JONIS-AI</text>

    <g>
      <circle cx="90" cy="450" r="1.6" fill="#22d3ee">
        <animate attributeName="cy" values="450;-20" dur="12s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="215" cy="450" r="1.2" fill="#a5b4fc">
        <animate attributeName="cy" values="450;-20" dur="15s" begin="-7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="15s" begin="-7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="450" r="1.8" fill="#22d3ee">
        <animate attributeName="cy" values="450;-20" dur="11s" begin="-4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="-4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="870" cy="450" r="1.4" fill="#8b5cf6">
        <animate attributeName="cy" values="450;-20" dur="14s" begin="-9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="14s" begin="-9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="450" r="1.6" fill="#22d3ee">
        <animate attributeName="cy" values="450;-20" dur="13s" begin="-5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="13s" begin="-5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="450" r="1.2" fill="#a5b4fc">
        <animate attributeName="cy" values="450;-20" dur="16s" begin="-11s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="16s" begin="-11s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="1" y="1" width="1198" height="438" rx="28" fill="none" stroke="#26314a" stroke-width="1"/>
  </g>
</svg>
