<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Build the future. Ship the impossible. JONIS.AI">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060c"/>
      <stop offset="0.5" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0b0a1a"/>
    </linearGradient>
    <radialGradient id="fglowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fglowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineOne" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.6" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="lineTwo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <clipPath id="fframe">
      <rect width="1200" height="240" rx="24"/>
    </clipPath>
    <clipPath id="ftextClip">
      <text x="600" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3">BUILD THE FUTURE.</text>
      <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3">SHIP THE IMPOSSIBLE.</text>
    </clipPath>
    <filter id="fblur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <g clip-path="url(#fframe)">
    <rect width="1200" height="240" fill="url(#fbg)"/>
    <rect width="1200" height="240" fill="url(#fgrid)" opacity="0.35"/>
    <ellipse cx="200" cy="240" rx="320" ry="180" fill="url(#fglowCyan)">
      <animate attributeName="opacity" values="0.8;0.5;0.8" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1000" cy="0" rx="320" ry="180" fill="url(#fglowViolet)">
      <animate attributeName="opacity" values="0.5;0.85;0.5" dur="9s" repeatCount="indefinite"/>
    </ellipse>

    <text x="600" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="#22d3ee" opacity="0.2" filter="url(#fblur)">BUILD THE FUTURE.</text>
    <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="#8b5cf6" opacity="0.2" filter="url(#fblur)">SHIP THE IMPOSSIBLE.</text>
    <text x="600" y="96" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="url(#lineOne)">BUILD THE FUTURE.</text>
    <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="3" fill="url(#lineTwo)">SHIP THE IMPOSSIBLE.</text>
    <g clip-path="url(#ftextClip)">
      <rect x="-260" y="44" width="200" height="130" fill="url(#fsweep)" opacity="0.75">
        <animate attributeName="x" values="-260;1130;1130" keyTimes="0;0.55;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <line x1="330" y1="198" x2="510" y2="198" stroke="url(#fedge)" stroke-width="1">
      <animate attributeName="x1" values="380;330;380" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="690" y1="198" x2="870" y2="198" stroke="url(#fedge)" stroke-width="1">
      <animate attributeName="x2" values="820;870;820" dur="7s" repeatCount="indefinite"/>
    </line>
    <text x="600" y="202" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#475569">JONIS.AI · 2026</text>

    <rect x="1" y="1" width="1198" height="238" rx="24" fill="none" stroke="#26314a" stroke-width="1"/>
  </g>
</svg>
